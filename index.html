<style>
/* Layout: map-first app. Phone: street map on top, bottom sheet with the stop list, fixed Start button.
   Wide screens: map on the left, stop panel on the right. */
:root{
  --bg:#eef1f4; --sheet:#ffffff; --ink:#111b27; --soft:#5f6e7d; --line:#e2e7ec; --chip:#f2f4f7;
  --route:#1f6feb; --route-tint:#e6f0ff; --on-route:#ffffff; --bus:#ffbe1a; --bus-ink:#2b1d00; --walk:#7a52f4;
  --ok:#16865a; --warn:#b4540a; --warn-tint:#fff3e3;
  --shadow:0 10px 30px rgba(17,27,39,.12),0 2px 6px rgba(17,27,39,.06);
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1118; --sheet:#141c26; --ink:#eef3f8; --soft:#93a2b1; --line:#243141; --chip:#1c2633;
  --route:#5aa0ff; --route-tint:#16263d; --on-route:#06121f; --bus:#ffc83d; --bus-ink:#2b1d00; --walk:#a68bff;
  --ok:#4fd197; --warn:#ffb067; --warn-tint:#2d2013;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1118; --sheet:#141c26; --ink:#eef3f8; --soft:#93a2b1; --line:#243141; --chip:#1c2633;
  --route:#5aa0ff; --route-tint:#16263d; --on-route:#06121f; --bus:#ffc83d; --bus-ink:#2b1d00; --walk:#a68bff;
  --ok:#4fd197; --warn:#ffb067; --warn-tint:#2d2013;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--f);-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--route);outline-offset:2px}

.app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr)}
#map{position:absolute;inset:0;background:var(--bg);z-index:0}
.darktiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.7)}

/* top bar floating over the map */
.top{position:absolute;z-index:500;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--sheet);border-radius:14px;padding:7px 12px 7px 7px;box-shadow:var(--shadow);min-width:0}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--bus);display:grid;place-items:center;flex:none}
.brand b{font:800 15px/1 var(--f);white-space:nowrap}
.brand span{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand div{display:flex;flex-direction:column;gap:2px;min-width:0}
.spacer{flex:1}
.fab{border:0;background:var(--sheet);color:var(--ink);border-radius:14px;height:44px;padding:0 14px;font-weight:800;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;white-space:nowrap}
.fab.primary{background:var(--ink);color:var(--sheet)}

/* bottom sheet */
.sheet{position:absolute;z-index:600;left:0;right:0;bottom:0;max-height:56%;background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(17,27,39,.16);display:flex;flex-direction:column;transition:max-height .25s ease}
.sheet.min{max-height:190px}
.grab{border:0;background:none;padding:10px 0 4px;display:grid;place-items:center;flex:none}
.grab::before{content:"";width:42px;height:5px;border-radius:9px;background:var(--line)}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sum{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sum h2{margin:0;font:800 22px/1.1 var(--f);letter-spacing:-.01em}
.sum .meta{color:var(--soft);font:600 13px var(--m)}
.status{font-size:13px;color:var(--soft);display:flex;align-items:center;gap:8px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--route);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status .dot{animation:none}.sheet{transition:none}}

.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px 12px;background:var(--sheet)}
.stop.sel{border-color:var(--route);box-shadow:0 0 0 3px var(--route-tint)}
.num{width:36px;height:36px;border-radius:12px;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font:800 16px var(--f)}
.stop h3{margin:0;font:800 16px/1.25 var(--f);overflow-wrap:anywhere}
.note{font:500 12.5px var(--m);color:var(--soft);margin-top:2px;overflow-wrap:anywhere}
.busline{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:8px 10px;font-size:13.5px;min-width:0}
.busline .ic{width:24px;height:24px;border-radius:7px;background:var(--bus);display:grid;place-items:center;flex:none}
.busline .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.busline .t b{font-weight:800}
.busline .walk{margin-left:auto;font:600 12.5px var(--m);color:var(--walk);white-space:nowrap}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.act{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 12px;font-weight:800;font-size:13.5px;text-decoration:none;color:var(--ink);text-align:center;white-space:nowrap}
.act.go{background:var(--route);border-color:var(--route);color:var(--on-route)}
.flag{display:inline-block;font:700 11px var(--f);text-transform:uppercase;letter-spacing:.05em;color:var(--warn);background:var(--warn-tint);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}

.miss{border:1.5px dashed var(--warn);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--warn-tint)}
.miss h3{margin:0;font:800 15px var(--f);color:var(--warn)}
.mrow{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:0}
.mname{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}
.lnk{color:var(--route);font-weight:700;font-size:13.5px;text-decoration:none}
.mini{display:flex;gap:6px}
.mini input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 10px;font:500 14px var(--m)}
.mini button{border:0;background:var(--ink);color:var(--sheet);border-radius:10px;padding:0 12px;font-weight:800}

.empty{text-align:center;padding:18px 6px 4px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{font:800 19px var(--f)}
.empty p{margin:0;color:var(--soft);max-width:34ch}

/* start bar */
.startbar{position:absolute;z-index:700;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--sheet) 70%,transparent);display:flex;gap:8px}
.start{flex:1;border:0;border-radius:16px;background:var(--bus);color:var(--bus-ink);font:800 17px var(--f);padding:16px;text-align:center;text-decoration:none;box-shadow:0 6px 18px rgba(255,190,26,.35)}
.more{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:16px;padding:0 16px;font-weight:800;text-decoration:none;color:var(--ink);display:grid;place-items:center}

/* editor sheet */
.editor{position:absolute;z-index:900;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:flex-end;justify-content:center}
.ebox{width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.ebox h2{margin:0;font:800 22px var(--f)}
.ebox p{margin:0;color:var(--soft);font-size:14px}
textarea{width:100%;min-height:42vh;resize:vertical;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;font:500 16px/1.55 var(--m)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--soft);min-width:0}
select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;font-weight:600}
.btn{border:0;border-radius:14px;padding:15px;font:800 16px var(--f);background:var(--ink);color:var(--sheet)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.toast{position:absolute;z-index:1000;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.pickbar{position:absolute;z-index:800;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--bus);color:var(--bus-ink);padding:10px 14px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:92vw}
.pickbar button{border:0;background:rgba(0,0,0,.12);border-radius:10px;padding:6px 10px;font-weight:800}

/* markers */
.mk{width:32px;height:32px;border-radius:50%;background:#111b27;color:#fff;border:3px solid #fff;display:grid;place-items:center;font:800 14px/1 var(--f);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.mk.sel{background:#1f6feb}
.bk{width:26px;height:26px;border-radius:8px;background:#ffbe1a;border:2.5px solid #fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.ek{width:28px;height:28px;border-radius:8px;background:#16865a;color:#fff;border:3px solid #fff;display:grid;place-items:center;font:800 12px var(--f);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.leaflet-container{font-family:var(--f)}
.leaflet-top{top:calc(64px + env(safe-area-inset-top,0px))}
.leaflet-control-zoom{display:none}

@media (min-width:900px){
  .sheet{left:auto;right:16px;bottom:16px;top:calc(76px + env(safe-area-inset-top,0px));width:420px;max-height:none;border-radius:22px}
  .sheet.min{max-height:none}
  .grab{display:none}
  .scroll{padding-top:16px}
  .startbar{left:auto;right:16px;bottom:16px;width:420px;border-radius:0 0 22px 22px}
  .editor{align-items:center}
  .ebox{border-radius:22px}
  .leaflet-control-zoom{display:block}
}
</style>
</head>

<div class="app">

  <div class="top">

  </div>

  <div class="pickbar" id="pickbar" hidden><span id="pickText">Tap the map where the bus should stop</span><button type="button" id="pickCancel">Cancel</button></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

const TR={"ı":"i","İ":"i","ş":"s","Ş":"s","ç":"c","Ç":"c","ğ":"g","Ğ":"g","ü":"u","Ü":"u","ö":"o","Ö":"o","â":"a","é":"e"};

// all good matches for one line, best first
function findHotels(text){
  const key=core(text);if(!key)return[];
  if(learned[key]){const h=allHotels().find(x=>x[0]===learned[key]);if(h)return[{h,score:2,used:key.split(" ").length}]}
  const words=key.split(" "),byH=new Map();
  for(let k=Math.min(4,words.length);k>=1;k--){
    const pre=words.slice(0,k).join(" ");
    for(const [a,h,isPre] of index()){
      if(pre!==a&&Math.abs(pre.length-a.length)>Math.max(pre.length,a.length)*0.27)continue;
      const s=(pre===a?1.01:sim(pre,a))-(h[4]?0.03:0)-(isPre?0.06:0)+k*0.001;
      const o=byH.get(h);if(!o||s>o.score)byH.set(h,{h,score:s,used:k});
    }
  }
  const all=[...byH.values()].filter(x=>x.score>=0.78).sort((a,b)=>b.score-a.score);

// ===================== parse list =====================
function parse(txt){
  const rows=[],missing=[];
  for(const raw of txt.split(/\r?\n/)){
    const line=raw.replace(/^\s*\d+[.)]\s+/,"").trim();
    if(!line||/^[\d\s+.,-]+$/.test(line))continue;
    const c=findHotels(line);
    if(c.length)rows.push({line,c});else missing.push({typed:line});
  }
  // when several hotels have the same name, take the one closest to the rest of the list
  const sure=rows.filter(r=>r.c.length===1||r.c[0].score-r.c[1].score>=0.05).map(r=>r.c[0].h);
  const anc=sure.length?{lat:sure.reduce((a,h)=>a+h[1],0)/sure.length,lng:sure.reduce((a,h)=>a+h[2],0)/sure.length}:{lat:41.012,lng:28.965};
  const stops=rows.map(r=>{
    const tw=new Set(norm(r.line).split(" ")),hit=r.c.map(x=>[x,x.score+norm(x.h[0]).split(" ").filter(w=>tw.has(w)&&!/^(hotel|hotels|otel|oteli|the|istanbul)$/.test(w)).reduce((a,w)=>a+(STOP.has(w)?0.1:0.01),0)-Math.min(0.2,hav(anc,{lat:x.h[1],lng:x.h[2]})/30000)]).sort((a,b)=>b[1]-a[1])[0][0];
    const words=r.line.split(/\s+/);let dropped=0,skipping=true,rest=[];
    for(const w of words){if(skipping){if(core(w)===""){continue}if(dropped<hit.used){dropped++;continue}skipping=false}rest.push(w)}
    return{name:hit.h[0],lat:hit.h[1],lng:hit.h[2],note:rest.join(" "),typed:r.line};
  });
  return {stops,missing};
}

function hav(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dg=(b.lng-a.lng)*t,x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

// ===================== routing =====================
let COST=(a,b)=>hav(a,b)*1.35;

function orderStops(items,start,end){
  const n=items.length;if(n<2)return items.slice();
  const firsts=start?[null]:items.map((_,i)=>i);let best=null;
  for(const f of firsts){
    const left=items.slice();let order=[],at=start;
    if(f!==null){order.push(left.splice(f,1)[0]);at=order[0]}
    while(left.length){let bi=0,bd=Infinity;left.forEach((s,i)=>{const d=COST(at,s);if(d<bd){bd=d;bi=i}});at=left.splice(bi,1)[0];order.push(at)}
    const full=()=>[...(start?[start]:[]),...order,...(end?[end]:[])];
    let improved=true,guard=0;
    while(improved&&guard++<50){improved=false;for(let i=0;i<order.length-1;i++)for(let j=i+1;j<order.length;j++){const before=pathCost(full()),o=order;order=order.slice(0,i).concat(order.slice(i,j+1).reverse(),order.slice(j+1));if(pathCost(full())<before-1e-6)improved=true;else order=o}}
    const L=pathCost(full());if(!best||L<best.L)best={L,order};
  }
  return best.order;
}

  try{const v=Math.floor(Date.now()/864e5),d=await fetchFirst(["roads.json?v="+v,REPO_RAW+"roads.json?v="+v],20000);
    if(!d||!Array.isArray(d.w)||d.w.length<100)return null;

async function findBusSpots(hotels){

  let k=0;
  await Promise.all(missing.map(async m=>{
    const q=cleanQ(m.typed),key=core(q)||q;m.err=false;
    if(!key){m.sugg=[];return}
    const tries=[["p1:"+q,()=>photon(q,1)],["p2:"+key,()=>photon(key+" hotel",1)],["n1:"+key,()=>nominatim(key+" hotel")],["p3:"+key,()=>photon(key,0)],["n2:"+key,()=>nominatim(key)]];
    const all=[];let fails=0,pick=null;
    for(const [ck,fn] of tries){
      let r;try{r=await cached(ck,fn)}catch(e){fails++;continue}
      for(const c of r){if(c[0]&&!all.some(x=>hav({lat:x[1],lng:x[2]},{lat:c[1],lng:c[2]})<120&&core(x[0])===core(c[0])))all.push(c)}
      const sc=all.map(c=>[c,scoreC(key,c,anchor)]).sort((a,b)=>b[1]-a[1]);
      if(sc.length&&sc[0][1]>=0.82){const [t,s]=sc[0],second=sc.find(x=>x[0]!==t&&hav({lat:x[0][1],lng:x[0][2]},{lat:t[1],lng:t[2]})>150);
        if(!second||second[1]<s-0.06){pick=t;break}}
    }
    k++;state.busy=`Looking up hotels on the map… ${k} of ${missing.length}`;render();
    if(pick){addHotel(pick[0],pick[1],pick[2],m.typed,true);changed=true;return}
    m.sugg=all.map(c=>[c,scoreC(key,c,anchor)]).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
    if(!m.sugg.length&&fails>=tries.length-1)m.err=true;
  }));
  return changed;
}
async function loadOSM(){
  try{const v=Math.floor(Date.now()/36e5),d=await fetchFirst(["hotels.json?v="+v,REPO_RAW+"hotels.json?v="+v],15000);
    if(Array.isArray(d)&&d.length>100){OSM=d.filter(x=>x&&x[0]&&x[1]).map(x=>[x[0],x[1],x[2],x[3]||[],1]);_idx=null;store.set("pp-osm",{t:Date.now(),d:OSM});return true}}catch(e){}
  return false;
}

// ===================== map =====================
const $=id=>document.getElementById(id);
let map,layer,tiles;
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function initMap(){
  if(!window.L){$("map").innerHTML='<p style="padding:90px 20px;text-align:center;color:var(--soft)">The map needs internet.</p>';return}
  map=L.map("map",{zoomControl:true,attributionControl:true}).setView([41.0086,28.9700],14);
  tiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,className:isDark()?"darktiles":"",attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on("click",e=>{if(pinHotel!=null)setHotelPin(e.latlng);else if(picking!=null)setManualSpot(e.latlng)});
}
const BUS_SVG='<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#2b1d00" d="M5 3h14a2 2 0 0 1 2 2v11a2 2 0 0 1-1 1.7V20a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2.3A2 2 0 0 1 3 16V5a2 2 0 0 1 2-2Zm0 3v5h14V6H5Zm2 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm10 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>';
function drawMap(fit){
  if(!map)return;layer.clearLayers();
  const R=state.route;if(!R)return;
  const icon=(html,cls,s)=>L.divIcon({className:"",html:`<div class="${cls}">${html}</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]});
  const pts=[];
  if(R.geom&&R.geom.length>1){L.polyline(R.geom,{color:"#ffffff",weight:9,opacity:.9}).addTo(layer);L.polyline(R.geom,{color:"#1f6feb",weight:5}).addTo(layer)}
  else if(R.line.length>1){L.polyline(R.line.map(p=>[p.lat,p.lng]),{color:"#1f6feb",weight:4,dashArray:"8 8"}).addTo(layer)}
  if(R.start){L.marker([R.start.lat,R.start.lng],{icon:icon("S","ek",28)}).addTo(layer);pts.push([R.start.lat,R.start.lng])}
  if(R.end){L.marker([R.end.lat,R.end.lng],{icon:icon("F","ek",28)}).addTo(layer);pts.push([R.end.lat,R.end.lng])}
  R.stops.forEach((s,i)=>{
    const b=s.bus;
    if(!b.none&&hav(s,b)>15){L.polyline([[b.lat,b.lng],[s.lat,s.lng]],{color:"#7a52f4",weight:3,dashArray:"2 7",lineCap:"round"}).addTo(layer);
      L.marker([b.lat,b.lng],{icon:icon(BUS_SVG,"bk",26),zIndexOffset:500}).addTo(layer).on("click",()=>select(i,true));pts.push([b.lat,b.lng])}
    L.marker([s.lat,s.lng],{icon:icon(i+1,"mk"+(state.sel===i?" sel":""),32),zIndexOffset:1000-i}).addTo(layer).on("click",()=>select(i,true));
    pts.push([s.lat,s.lng]);
  });
  if(fit&&pts.length){const b=L.latLngBounds(pts);map.fitBounds(b,{paddingTopLeft:[30,80],paddingBottomRight:[wide()?470:30,wide()?30:Math.round(innerHeight*0.45)],maxZoom:17})}
}

// ===================== app state + render =====================
const state={text:"",route:null,missing:[],sel:null,busy:""};
let picking=null;
const wide=()=>matchMedia("(min-width:900px)").matches;
function place(k){const p=PLACES[k];return p&&p[1]!=null?{name:p[0],lat:p[1],lng:p[2]}:null}
let toastT;function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}
let runId=0;

async function plan(){
  const my=++runId;
  const {stops,missing}=parse(state.text);
  state.missing=missing;state.sel=null;
  // merge duplicates
  const merged=[];for(const s of stops){const m=merged.find(x=>x.name===s.name);if(m)m.notes.push(s.note);else merged.push({name:s.name,lat:s.lat,lng:s.lng,notes:[s.note]})}
  state.hotels=merged;
  build(false);render(true);
  if(missing.length){state.busy="Looking up hotels on the map…";render();const ch=await lookupMissing(missing,merged);if(my!==runId)return;if(ch){return plan()}}
  if(merged.length){state.busy="Finding where the bus can stop…";render();const got=await findBusSpots(merged);if(my!==runId)return;if(got){build(false);render(true)}}
  if(merged.length){state.busy="Checking real driving times…";render();await roadOrder(my);if(my!==runId)return}
  state.busy="";render();
}
function build(keepOrder){
  const start=place($("start").value),end=place($("end").value);
  const items=(state.hotels||[]).map(h=>({...h,bus:busOf(h)}));
  // the bus drives between bus spots
  const nodes=items.map(it=>({it,lat:it.bus.lat,lng:it.bus.lng}));
  const ordered=orderStops(nodes,start,end).map(n=>n.it);
  const line=[...(start?[start]:[]),...ordered.map(s=>s.bus),...(end?[end]:[])];
  state.route={start,end,stops:ordered,line,geom:null,km:null,min:null};
}
async function roadOrder(my){
  const R=state.route;if(!R||!R.stops.length)return;
  const nodes=[...R.stops.map(s=>({it:s,lat:s.bus.lat,lng:s.bus.lng}))];
  const all=[...(R.start?[R.start]:[]),...nodes,...(R.end?[R.end]:[])];
  if(all.length>=2&&all.length<=60){
    try{
      const t=await fetchJSON(`${OSRM}/table/v1/driving/${all.map(p=>p.lng.toFixed(6)+","+p.lat.toFixed(6)).join(";")}?annotations=duration`,{},15000);
      if(my!==runId)return;
      if(t.code==="Ok"){const key=p=>p.lat.toFixed(6)+","+p.lng.toFixed(6);const M=new Map();all.forEach((a,i)=>all.forEach((b,j)=>M.set(key(a)+"|"+key(b),t.durations[i][j]??1e7)));
        COST=(a,b)=>M.get(key(a)+"|"+key(b))??hav(a,b);const ord=orderStops(nodes,R.start,R.end);COST=(a,b)=>hav(a,b)*1.35;
        R.stops=ord.map(n=>n.it);R.line=[...(R.start?[R.start]:[]),...R.stops.map(s=>s.bus),...(R.end?[R.end]:[])]}
    }catch(e){COST=(a,b)=>hav(a,b)*1.35}
  }
  if(R.line.length>=2){
    try{const r=await fetchJSON(`${OSRM}/route/v1/driving/${R.line.map(p=>p.lng.toFixed(6)+","+p.lat.toFixed(6)).join(";")}?overview=full&geometries=geojson`,{},15000);
      if(my!==runId)return;
      if(r.code==="Ok"){const x=r.routes[0];R.geom=x.geometry.coordinates.map(c=>[c[1],c[0]]);R.km=x.distance/1000;R.min=Math.round(x.duration/60)}}catch(e){}
  }
  render(true);
}

function render(fit){
  const out=$("out"),R=state.route,n=R?R.stops.length:0;
  $("sub").textContent=n?`${n} hotel${n>1?"s":""}${R.km!=null?" · "+R.km.toFixed(1)+" km":""}`:"Hotel pickups by bus";
  if(!state.text.trim()){
    out.innerHTML=`<div class="empty"><b>Where are we picking up?</b><p>Tap <b>New list</b> and write the hotel names. You get the order, a bus stop for every hotel and the route.</p><button class="btn" type="button" id="emptyNew" style="width:100%;max-width:320px">New list</button></div>`;
    $("emptyNew").onclick=openEditor;$("startbar").hidden=true;drawMap(false);return;
  }
  let h=`<div class="sum"><h2>${n} stop${n===1?"":"s"}</h2>${R&&R.km!=null?`<span class="meta">${R.km.toFixed(1)} km · ~${R.min} min driving</span>`:""}</div>`;
  if(state.busy)h+=`<div class="status"><span class="dot"></span>${esc(state.busy)}</div>`;
  if(n){
    h+=`<ol class="stops">`+R.stops.map((s,i)=>{
      const b=s.bus,walk=b.none?0:hav(s,b);
      const notes=s.notes.filter(Boolean).join(" · ");
      const spot=b.none?`<span class="t">Bus stop: finding…</span>`:(walk<=15&&!b.approx?`<span class="t"><b>Stop in front of the hotel</b></span>`:`<span class="t">Bus stop: <b>${esc(b.label||"nearby road")}</b>${b.manual?" (yours)":b.approx?" (approx.)":""}</span><span class="walk">${walkMin(walk)} min walk</span>`);
      return `<li class="stop${state.sel===i?" sel":""}" data-i="${i}">
        <div class="num">${i+1}</div>
        <div style="min-width:0"><h3>${esc(s.name)}${autoNames.has(s.name)?'<span class="flag">check</span>':""}</h3>${notes?`<div class="note">${esc(notes)}</div>`:""}</div>
        <div class="busline"><span class="ic">${BUS_SVG}</span>${spot}</div>
        <div class="acts">
          <a class="act go" href="${driveTo(b)}" target="_blank" rel="noopener">Drive</a>
          ${!b.none&&walk>15?`<a class="act" href="${walkTo(b,s)}" target="_blank" rel="noopener">Walk</a>`:""}
          <button class="act" type="button" data-move="${i}">Move stop</button>
        </div></li>`}).join("")+`</ol>`;
  }
  if(state.missing.length){
    h+=`<div class="miss"><h3>${state.missing.length} not found</h3>`+state.missing.map((m,i)=>`<div class="mrow"><div class="mname">${esc(m.typed)}</div>
      ${m.sugg&&m.sugg.length?`<div class="chips">${m.sugg.map((s,j)=>`<button class="chip" type="button" data-sug="${i}:${j}">${esc(s[0])}${s[3]?" · "+esc(s[3]):""}</button>`).join("")}</div>`:(m.err?`<div class="note">The map search did not answer. Check internet and tap Try again.</div>`:m.sugg?`<div class="note">Not found by name. Tap Put on map and touch the hotel.</div>`:"")}
      <div class="acts"><button class="act go" type="button" data-pin="${i}">Put on map</button>${m.err?`<button class="act" type="button" data-retry="1">Try again</button>`:""}</div>
      <div class="mini"><input id="loc${i}" placeholder="Paste 41.0123, 28.9567" inputmode="decimal" aria-label="Location for ${esc(m.typed)}"><button type="button" data-loc="${i}">Save</button></div>
      <a class="lnk" href="${searchLink(m.typed)}" target="_blank" rel="noopener">Open in Google Maps to copy the location</a></div>`).join("")+`</div>`;
  }
  out.innerHTML=h;
  out.querySelectorAll(".stop").forEach(el=>el.addEventListener("click",e=>{if(e.target.closest("a,button"))return;select(+el.dataset.i,false)}));
  out.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>startPick(+b.dataset.move));
  out.querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.sug.split(":").map(Number);const m=state.missing[i],s=m.sugg[j];addHotel(s[0],s[1],s[2],m.typed,false);toast("Saved "+s[0]);plan()});
  out.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>startPinHotel(+b.dataset.pin));
  out.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{for(const k in online){const c=online[k];if(c&&!Array.isArray(c)&&c.r&&!c.r.length)delete online[k]}store.set("pp-online",online);plan()});
  out.querySelectorAll("[data-loc]").forEach(b=>b.onclick=()=>{const i=+b.dataset.loc,m=state.missing[i],c=parseCoords($("loc"+i).value);if(!c){toast("Paste numbers like 41.0123, 28.9567");return}addHotel(m.typed.replace(/\s+/g," "),c[0],c[1],m.typed,false);toast("Saved");plan()});
  // start bar
  if(R&&R.line.length>=1&&n){
    const gl=R.line.length>=2?gmapsLinks(R.line):[driveTo(R.line[0])];
    $("startbar").innerHTML=`<a class="start" href="${gl[0]}" target="_blank" rel="noopener">Start route${gl.length>1?" (part 1 of "+gl.length+")":""}</a><a class="more" href="${yandexLink(R.line)}" target="_blank" rel="noopener">Yandex</a><button class="more" type="button" id="share">Share</button>`;
    $("startbar").hidden=false;
    $("share").onclick=shareList;
  }else $("startbar").hidden=true;
  drawMap(fit);
}
function select(i,fromMap){state.sel=i;render(false);const el=document.querySelector(`.stop[data-i="${i}"]`);if(el&&fromMap){$("sheet").classList.remove("min");el.scrollIntoView({block:"nearest",behavior:"smooth"})}
  const s=state.route.stops[i];if(map&&s){const pts=[[s.lat,s.lng]];if(!s.bus.none)pts.push([s.bus.lat,s.bus.lng]);map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[40,90],paddingBottomRight:[wide()?470:40,wide()?40:Math.round(innerHeight*0.5)],maxZoom:18})}}
function startPick(i){picking=i;$("pickText").textContent=`Tap the map where the bus should stop for ${state.route.stops[i].name}`;$("pickbar").hidden=false;$("sheet").classList.add("min");select(i,false)}
function setManualSpot(latlng){const s=state.route.stops[picking];busManual[s.name]=[+latlng.lat.toFixed(6),+latlng.lng.toFixed(6),"Your spot"];store.set("pp-bus",busManual);picking=null;$("pickbar").hidden=true;$("sheet").classList.remove("min");toast("Bus stop saved for "+s.name);state.hotels=state.hotels;build(false);render(true);roadOrder(++runId)}
let pinHotel=null;
function startPinHotel(i){pinHotel=i;picking=null;$("pickText").textContent=`Touch the map where ${state.missing[i].typed} is`;$("pickbar").hidden=false;$("sheet").classList.add("min")}
function setHotelPin(latlng){const m=state.missing[pinHotel];pinHotel=null;$("pickbar").hidden=true;$("sheet").classList.remove("min");if(!m)return;addHotel(m.typed.replace(/\s+/g," ").trim(),+latlng.lat.toFixed(6),+latlng.lng.toFixed(6),m.typed,false);toast("Saved "+m.typed);plan()}
$("pickCancel").onclick=()=>{picking=null;pinHotel=null;$("pickbar").hidden=true;$("sheet").classList.remove("min")};
function shareList(){
  const R=state.route;const lines=R.stops.map((s,i)=>`${i+1}. ${s.name}${s.notes.filter(Boolean).length?" — "+s.notes.filter(Boolean).join(" / "):""}\nBus: ${driveTo(s.bus)}`);
  const gl=gmapsLinks(R.line);const text=lines.join("\n")+(gl.length?"\nRoute: "+gl.join("\n"):"");
  if(navigator.share){navigator.share({text}).catch(()=>{});return}
  const done=()=>toast("Copied. Paste it in WhatsApp");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,()=>toast("Copy didn't work here"));else toast("Copy didn't work here");
}
function parseCoords(s){const m=s.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/)||s.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);return m?[+m[1],+m[2]]:null}

// ===================== editor =====================
function openEditor(){$("list").value=state.text;$("editor").hidden=false;setTimeout(()=>$("list").focus(),50)}
function closeEditor(){$("editor").hidden=true}
for(const sel of ["start","end"])$(sel).innerHTML=Object.entries(PLACES).map(([k,v])=>`<option value="${k}">${esc(k==="none"?(sel==="end"?"Last hotel":"Planner chooses"):v[0])}</option>`).join("");
{const se=store.get("pp-se",["none","none"]);$("start").value=se[0]||"none";$("end").value=se[1]||"none"}
$("newList").onclick=openEditor;
$("cancel").onclick=closeEditor;
$("editor").addEventListener("click",e=>{if(e.target===$("editor"))closeEditor()});
$("plan").onclick=()=>{state.text=$("list").value;store.set("pp-se",[$("start").value,$("end").value]);closeEditor();if(!state.text.trim()){render(false);return}$("sheet").classList.remove("min");plan()};
$("grab").onclick=()=>$("sheet").classList.toggle("min");
$("locate").onclick=()=>drawMap(true);
addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("editor").hidden)closeEditor();else if(picking!=null)$("pickCancel").click()}});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>map&&map.invalidateSize(),200)});

// ===================== start =====================
initMap();
render(false);
openEditor();
loadOSM().then(ok=>{if(ok&&state.text.trim())plan()});
</script>
