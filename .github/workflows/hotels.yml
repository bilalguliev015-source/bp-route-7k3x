name: Update map data

# Every Monday: downloads the OpenStreetMap file for Turkey and saves
#  hotels.json - every named hotel, hostel, guest house and apart hotel in Istanbul
#  roads.json  - main roads and bus parkings in central Istanbul (for bus stops)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hotels.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Download Turkey map
        run: curl -sSfL --retry 3 -o tr.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf && ls -lh tr.pbf

      - name: Cut out Istanbul
        run: |
          osmium extract -b 27.95,40.80,29.95,41.60 tr.pbf -o ist.pbf
          osmium tags-filter ist.pbf nwr/tourism=hotel,hostel,guest_house,apartment,motel -o h.pbf
          osmium export h.pbf -f geojsonseq --format-option print_record_separator=false -o h.jsonl
          osmium extract -b 28.80,40.95,29.15,41.12 ist.pbf -o c.pbf
          osmium tags-filter c.pbf w/highway=trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link nwr/amenity=parking -o r.pbf
          osmium export r.pbf -f geojsonseq --format-option print_record_separator=false -o r.jsonl

      - name: Make app files
        run: |
          python3 - <<'PY'
          import json
          def centre(g):
              t=g["type"];c=g["coordinates"]
              if t=="Point": return c
              if t=="LineString": pts=c
              elif t=="Polygon": pts=c[0]
              elif t=="MultiPolygon": pts=c[0][0]
              else: return None
              return [sum(p[0] for p in pts)/len(pts), sum(p[1] for p in pts)/len(pts)]
          hotels={}
          for line in open("h.jsonl",encoding="utf-8"):
              f=json.loads(line);p=f.get("properties") or {}
              n=p.get("name")
              if not n or p.get("tourism") not in ("hotel","hostel","guest_house","apartment","motel"): continue
              c=centre(f["geometry"])
              if not c: continue
              al=[p[k] for k in ("name:en","name:tr","alt_name","old_name","int_name","brand") if p.get(k) and p.get(k)!=n]
              key=(n,round(c[1],3),round(c[0],3))
              hotels[key]=[n,round(c[1],6),round(c[0],6),al]
          json.dump(list(hotels.values()),open("hotels.json","w",encoding="utf-8"),ensure_ascii=False,separators=(",",":"))
          ways=[];parks=[]
          for line in open("r.jsonl",encoding="utf-8"):
              f=json.loads(line);p=f.get("properties") or {};g=f["geometry"]
              if p.get("amenity")=="parking":
                  if p.get("bus") in ("yes","designated") or p.get("hgv") in ("yes","designated") or "otob" in (p.get("name") or "").lower():
                      c=centre(g)
                      if c: parks.append([round(c[1],5),round(c[0],5),p.get("name") or "Bus parking"])
                  continue
              hw=p.get("highway")
              if not hw or g["type"]!="LineString": continue
              pts=[]
              for x,y in g["coordinates"]: pts+= [round(y*1e5),round(x*1e5)]
              ways.append([p.get("name") or "",hw.replace("_link",""),pts])
          json.dump({"w":ways,"p":parks},open("roads.json","w",encoding="utf-8"),ensure_ascii=False,separators=(",",":"))
          print("hotels",len(hotels),"roads",len(ways),"parkings",len(parks))
          PY
          ls -lh hotels.json roads.json
          rm -f *.pbf *.jsonl

      - name: Save
        run: |
          git config user.name "map-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotels.json roads.json
          git diff --cached --quiet || git commit -m "Update map data"
          git push
